<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="8" fill="#0f172a"/>
  <!-- Flowchart nodes -->
  <rect x="11" y="3" width="10" height="6" rx="2" fill="#6366f1"/>
  <!-- Arrow down from top node -->
  <line x1="16" y1="9" x2="16" y2="13" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="16,14.5 14.5,12.5 17.5,12.5" fill="#6366f1"/>
  <!-- Diamond decision node -->
  <polygon points="16,14.5 21,19 16,23.5 11,19" fill="#818cf8"/>
  <!-- Arrow left -->
  <line x1="11" y1="19" x2="6" y2="19" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Left terminal -->
  <rect x="2" y="16" width="4" height="6" rx="1.5" fill="#a5b4fc"/>
  <!-- Arrow right -->
  <line x1="21" y1="19" x2="26" y2="19" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right terminal -->
  <rect x="26" y="16" width="4" height="6" rx="1.5" fill="#a5b4fc"/>
  <!-- Arrow down from diamond -->
  <line x1="16" y1="23.5" x2="16" y2="27" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bottom terminal -->
  <rect x="11" y="27" width="10" height="4" rx="2" fill="#6366f1"/>
</svg>
